<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elayon — Sessão</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="bg"></div>

  <header class="topbar">
    <div class="brand">
      <div class="logo">
        <img class="logoImg" src="IMG-20260218-WA0016.jpg" alt="Elayon" />
      </div>
      <div>
        <div class="brand-title">Sessão CRS</div>
        <div class="brand-sub" id="subTitle">Médico • Paciente</div>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- STATUS -->
    <section class="card">
      <div class="row" style="justify-content: space-between;">
        <div>
          <div class="muted" style="font-size: 12px;">ID da Sessão</div>
          <div style="font-weight: 800;" id="sessId">--</div>
        </div>
        <div style="text-align: right;">
          <div class="muted" style="font-size: 12px;">Tempo Gravado</div>
          <div style="font-weight: 800;" id="timeRec">00:00</div>
        </div>
        <div style="text-align: right;">
          <div class="muted" style="font-size: 12px;">Status</div>
          <div style="font-weight: 800; color: var(--warning);" id="status">⏸️ Parado</div>
        </div>
      </div>
    </section>

    <!-- CONTROLES -->
    <section class="card">
      <h2>🎙️ Controles</h2>
      <div class="actions">
        <button class="btn primary" id="btnMic">
          🎤 Ativar Microfone
        </button>
        <button class="btn secondary" id="btnRec" disabled>
          🔴 Gravar
        </button>
        <button class="btn" id="btnStop" disabled>
          ⏹️ Parar
        </button>
        <button class="btn danger" id="btnEnd">
          🔚 Finalizar Sessão
        </button>
      </div>

      <!-- DEBUG LOG -->
      <div id="debugLog" style="
        margin-top: 16px;
        padding: 12px;
        background: rgba(0,0,0,0.05);
        border-radius: 8px;
        font-family: monospace;
        font-size: 11px;
        max-height: 120px;
        overflow-y: auto;
        color: var(--text-muted);
      ">
        [Aguardando...]
      </div>
    </section>

    <!-- GRÁFICOS -->
    <section class="card">
      <h2>📊 Análise em Tempo Real</h2>

      <div style="display: grid; gap: 16px; margin-top: 16px;">
        <!-- FFT -->
        <div class="canvasWrap">
          <div class="muted" style="font-size: 12px; margin-bottom: 8px;">Espectro de Frequência (FFT)</div>
          <canvas id="cvFft" width="800" height="240"></canvas>
        </div>

        <!-- SILÊNCIO -->
        <div class="canvasWrap">
          <div class="muted" style="font-size: 12px; margin-bottom: 8px;">Detecção de Silêncio</div>
          <canvas id="cvSil" width="800" height="240"></canvas>
        </div>

        <!-- OVERLAY (CRS) -->
        <div class="canvasWrap">
          <div class="muted" style="font-size: 12px; margin-bottom: 8px;">Dimensões CRS (8 linhas)</div>
          <canvas id="cvOv" width="800" height="240"></canvas>
        </div>
      </div>
    </section>

    <!-- MÉTRICAS RESUMIDAS -->
    <section class="card soft">
      <h2>📈 Métricas Atuais</h2>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px;">
        <div>
          <div class="muted" style="font-size: 12px;">Energia RMS</div>
          <div style="font-weight: 800; font-size: 18px;" id="mRms">0.000</div>
        </div>
        <div>
          <div class="muted" style="font-size: 12px;">Silêncio Detectado</div>
          <div style="font-weight: 800; font-size: 18px;" id="mSil">0.000</div>
        </div>
      </div>
    </section>
  </main>

  <script src="core/crs-engine/temporal-extractor.js"></script>
  <script src="core/crs-engine/signal-vectorizer.js"></script>
  <script src="core/crs-engine/cognitive-metrics.js"></script>
  <script src="core/crs-engine/crs-validator.js"></script>
  <script src="core/crs-engine/crs-integrator.js"></script>
  <script src="assets/session.js"></script>
</body>
</html>
