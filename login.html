<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elayon Health — Conexão</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="bg"></div>

  <main class="container" style="max-width:720px">
    <section class="card loginCard">
      <div class="loginLogoWrap">
        <img class="loginLogo" src="IMG-20260218-WA0016.jpg" alt="Elayon Health" />
      </div>

      <h1 style="text-align:center; margin-top:6px">Bem-vindos ao Elayon Health</h1>
      <p class="muted" style="text-align:center">
        Conexão de demonstração (sem cobrança).<br/>
        Ferramenta de apoio visual/métrico — <b>sem diagnóstico automático</b>.
      </p>

      <div class="actions" style="justify-content:center">
        <button class="btn primary" id="btnConnect">Iniciar conexão</button>
      </div>

      <div class="mini" style="justify-content:center">
        <div class="pill info">Demo • GitHub Pages</div>
        <div class="pill warn">Microfone só na sessão</div>
      </div>
    </section>
  </main>

  <footer class="footer"><span>Elayon Health • Conexão</span></footer>

  <script src="assets/auth.js"></script>
  <script>
    document.getElementById("btnConnect").addEventListener("click", () => {
      ELAYON.connectDemo();
      location.href = "index.html";
    });
  </script>
</body>
</html>
