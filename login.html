<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elayon Health — Acesso</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="bg"></div>

  <header class="topbar">
    <div class="brand">
      <div class="logo">
        <img src="IMG-20260218-WA0016.jpg" alt="Elayon" />
      </div>
      <div>
        <div class="brand-title">Elayon Health</div>
        <div class="brand-sub">Acesso do profissional • Demo</div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h1>Entrar</h1>
      <p class="muted">
        Acesso local (demo). Dados ficam <b>apenas neste dispositivo</b> (localStorage).
      </p>

      <div class="grid2">
        <div class="field">
          <label for="nome">Nome do profissional</label>
          <input id="nome" placeholder="Ex: Dr. Paulo" autocomplete="name" />
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" placeholder="Ex: doctor@email.com" autocomplete="email" />
        </div>
      </div>

      <div class="field">
        <label for="senha">Senha (demo)</label>
        <input id="senha" type="password" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <div class="actions">
        <button class="btn primary" id="btnEntrar">Entrar</button>
        <button class="btn" id="btnLimpar">Limpar</button>
      </div>

      <div class="mini">
        <div class="pill info">Sem diagnóstico — apoio visual/métrico</div>
        <div class="pill warn">Consentimento do paciente é obrigatório</div>
        <div class="pill ok">Humano no processo do começo ao fim</div>
      </div>
    </section>
  </main>

  <footer class="footer"><span>Elayon Health • Login (demo)</span></footer>

  <script>
    const KEY_USER = "elayon_user_demo";

    function $(id){ return document.getElementById(id); }

    $("btnLimpar").addEventListener("click", ()=>{
      $("nome").value = "";
      $("email").value = "";
      $("senha").value = "";
    });

    $("btnEntrar").addEventListener("click", ()=>{
      const nome = ($("nome").value || "").trim();
      const email = ($("email").value || "").trim();
      const senha = ($("senha").value || "").trim();

      if (!nome || !email || !senha){
        alert("Preencha nome, e-mail e senha.");
        return;
      }

      const user = { nome, email, ts: Date.now() };
      localStorage.setItem(KEY_USER, JSON.stringify(user));

      location.href = "index.html";
    });

    // se já estiver logado, vai direto
    try{
      const u = JSON.parse(localStorage.getItem(KEY_USER) || "null");
      if (u?.nome && u?.email) location.href = "index.html";
    }catch{}
  </script>
</body>
</html>
