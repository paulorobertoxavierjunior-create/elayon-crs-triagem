<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elayon Health — Conexão</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="bg"></div>

  <main class="container">
    <section class="card loginCard">
      <div class="loginCenter">
        <img class="loginLogo" src="IMG-20260218-WA0016.jpg" alt="Elayon Health" />
        <h1 class="loginTitle">Bem-vindos ao Elayon Health</h1>
        <p class="muted" style="margin-top:6px">
          Demo ética • Evidência visual congelada • Diagnóstico manual do médico
        </p>

        <div class="actions" style="margin-top:16px; justify-content:center">
          <button class="btn primary" id="btnConnect">Iniciar conexão</button>
        </div>

        <p class="hint" style="margin-top:12px">
          Observação: esta versão (GitHub Pages) salva dados apenas neste dispositivo (localStorage).
        </p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span>Elayon Health • Conexão</span>
  </footer>

  <script src="assets/auth.js"></script>
  <script>
    document.getElementById("btnConnect").addEventListener("click", () => {
      // marca “conectado” no dispositivo
      ELAYON.setConnection({ connectedAt: Date.now(), mode: "demo" });

      // manda pro Painel (index.html)
      location.href = "index.html";
    });
  </script>
</body>
</html>
