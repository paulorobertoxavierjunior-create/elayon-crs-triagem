    if(R.P.length>3){let s=0,q=0;for(let i=1;i<R.P.length;i++){s+=Math.abs(R.P[i]-R.P[i-1]);q+=Math.abs(20*Math.log10(R.A[i]/R.A[i-1]))}jit=s/(R.P.length-1)/med(R.P)*100;shim=q/(R.A.length-1)}}
  else{R.P=[];R.A=[]}

    for(let k=Math.floor(f1/bh);k<=Math.max(Math.floor(f2/bh),Math.floor(f1/bh));k++)if(fb[k]>m)m=fb[k];

function espectroide(tk,sec,ret,dur){

}

function addIA(t,q){const b=$('iab');if(b.textContent==='—')b.textContent='';b.textContent+=(q?'▸ '+q+'\n':'')+t+'\n\n';b.scrollTop=1e9}

/* ---- médico ---- */
function perguntar(){const t=$('pin').value.trim();if(!t)return;$('perg').textContent=t;tx_({t:'perg',txt:t})}
function capturar(){capt=!capt;tx_({t:'cmd',cmd:capt?'start':'stop'});$('bcap').textContent=capt?'⏹ Parar captura':'▶ Iniciar captura';$('stt').textContent=capt?'capturando…':'aguardando'}
async function aiCall(prompt,imgs){
  const k=ME.ai_key,pv=ME.ai_provider||'gemini',sys='Você é a IA do cockpit de um médico do Elayon Health (termômetro vocal CRS). Não emita diagnóstico: descreva achados acústicos estimados (microfone de celular), compare sessões, aponte pontos de atenção para o médico avaliar e sugira parâmetros e exercícios de autoexame. Linguagem clara, em português do Brasil, objetiva.';
  if(!k)throw new Error('Configure a chave de IA no perfil do médico.');
  if(pv==='openai'){const c=[{type:'text',text:prompt},...imgs.map(u=>({type:'image_url',image_url:{url:u}}))];
    return (await (await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+k},body:JSON.stringify({model:'gpt-4o',messages:[{role:'system',content:sys},{role:'user',content:c}]})})).json()).choices[0].message.content}
  const parts=[{text:prompt},...imgs.map(u=>({inline_data:{mime_type:'image/jpeg',data:u.split(',')[1]}}))];
  return (await (await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${k}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:[{role:'user',parts}]})})).json()).candidates[0].content.parts[0].text
}
const ctx=()=>JSON.stringify(S.map((s,i)=>({sessao:i+1,res:s.res,transcricao:s.transcricao})));
async function rodarIA(q,prompt){$('msg').textContent='🧠 IA analisando…';try{const t=(await aiCall(prompt,S.map(s=>s.img))).trim();addIA(t,q);tx_({t:'ia',txt:t,q});$('msg').textContent=''}catch(e){$('msg').textContent='❌ '+e.message}}
function analisarIA(){if(!S.length)return;rodarIA('Análise das sessões',`Analise as ${S.length} sessões (a 1ª é a mais recente). Dados: ${ctx()}. As imagens anexas são os espectroides, na mesma ordem. Entregue: 1) leitura dos gráficos em linguagem simples para explicar ao paciente; 2) comparação entre as sessões; 3) pontos de atenção para o médico; 4) faixas sugeridas de autoexame (F0, jitter, shimmer, HNR, pausas) e exercícios.`)}
function perguntarIA(){const q=$('iq').value.trim();if(!q||!S.length)return;$('iq').value='';rodarIA(q,`Pergunta do médico: ${q}. Dados das sessões: ${ctx()}. Imagens anexas = espectroides na ordem.`)}
async function concluir(){await sb.from('atendimento_fila').update({status:'analise'}).eq('id',A);tx_({t:'fim'});location.href='dashboard-pilot.html?lau='+A}
async function transcrever(s){
  if(!ME.ai_key)return;
  try{const blob=await (await fetch(pub(s.path))).blob(),w=await wav(blob);let t='';
    if((ME.ai_provider||'gemini')==='openai'){const f=new FormData();f.append('file',new Blob([w],{type:'audio/wav'}),'a.wav');f.append('model','whisper-1');f.append('language','pt');t=(await (await fetch('https://api.openai.com/v1/audio/transcriptions',{method:'POST',headers:{Authorization:'Bearer '+ME.ai_key},body:f})).json()).text||''}
    else{t=(await (await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${ME.ai_key}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:'Transcreva fielmente a fala em português do Brasil. Responda somente com a transcrição. Se não houver fala, responda exatamente: (silêncio)'},{inline_data:{mime_type:'audio/wav',data:b64(w)}}]}]})})).json()).candidates[0].content.parts[0].text}
    t=t.trim();if(t==='(silêncio)')t='(sem fala)';await sb.from('consulta_sessoes').update({transcricao:t}).eq('id',s.id);carregar()}catch(e){}
}

/* ---- paciente: só libera o microfone; o médico comanda a captura ---- */
async function permitirMic(){try{await crsAudio();$('bmic').textContent='✅ Microfone liberado';tx_({t:'st',txt:'microfone liberado'})}catch(e){alert(e&&e.name==='NotReadableError'?'Microfone em uso por outro app ou aba.':'Microfone indisponível')}}
function iniciar(){
  if(!R.an){tx_({t:'st',txt:'⚠️ paciente ainda não liberou o microfone'});return}
  if(rec)return;rec={tk:[]};chunks=[];mr=new MediaRecorder(R.stream);mr.ondataavailable=e=>chunks.push(e.data);mr.onstop=enviar;mr.start();
  $('stt').textContent='● gravando (comando do médico)';tx_({t:'st',txt:'● paciente gravando'})
}
function parar(){if(rec&&mr&&mr.state!=='inactive'){$('stt').textContent='enviando…';mr.stop()}}
async function enviar(){
  const rt=rec;rec=null;if(!rt.tk.length){tx_({t:'st',txt:'⚠️ captura vazia'});return}
  tx_({t:'st',txt:'⏳ processando áudio…'});
  const blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'}),{res,sec,ret}=analisarSessao(rt.tk),img=espectroide(rt.tk,sec,ret,Math.max(1,res.dur)),path=`${A}/${Date.now()}.webm`;
  const up=await sb.storage.from('consultas').upload(path,blob,{contentType:blob.type});if(up.error){tx_({t:'st',txt:'❌ upload: '+up.error.message});return}
  const ins=await sb.from('consulta_sessoes').insert({atendimento_id:A,user_id:U.id,path,dur:res.dur,res,img});if(ins.error){tx_({t:'st',txt:'❌ '+ins.error.message});return}
  const {data}=await sb.from('consulta_sessoes').select('id,path').eq('atendimento_id',A).order('criado_em',{ascending:false});
  for(const o of (data||[]).slice(3)){await sb.storage.from('consultas').remove([o.path]);await sb.from('consulta_sessoes').delete().eq('id',o.id)}   // FIFO: ficam as 3 últimas
  $('stt').textContent='aguardando';tx_({t:'st',txt:'✅ sessão enviada'});tx_({t:'novo'});carregar()
}
</script></body></html>
