<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elayon — Relatório</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="bg"></div>

  <header class="topbar">
    <div class="brand">
      <div class="logo">
        <img class="logoImg" src="IMG-20260218-WA0016.jpg" alt="Elayon" />
      </div>
      <div>
        <div class="brand-title">Relatório</div>
        <div class="brand-sub" id="subTitle">--</div>
      </div>
    </div>
    <nav class="nav">
      <a class="link" href="index.html">Início</a>
      <a class="link" href="report.html">Relatórios</a>
    </nav>
  </header>

  <main class="container">
    <!-- GRÁFICOS CONGELADOS -->
    <section class="card">
      <h2>📊 Gráficos Capturados</h2>

      <div style="display: grid; gap: 16px; margin-top: 16px;">
        <div>
          <div class="muted" style="font-size: 12px; margin-bottom: 8px;">Espectro (FFT)</div>
          <img id="imgFft" class="snap" />
        </div>
        <div>
          <div class="muted" style="font-size: 12px; margin-bottom: 8px;">Silêncio</div>
          <img id="imgSil" class="snap" />
        </div>
        <div>
          <div class="muted" style="font-size: 12px; margin-bottom: 8px;">CRS (8 dimensões)</div>
          <img id="imgOv" class="snap" />
        </div>
      </div>
    </section>

    <!-- JSON -->
    <section class="card">
      <h2>📋 Dados Brutos (JSON)</h2>
      <textarea id="jsonData" class="bigText" readonly style="min-height: 200px;"></textarea>
      <div class="actions" style="margin-top: 12px;">
        <button class="btn primary" id="btnCopy">
          📋 Copiar JSON
        </button>
        <button class="btn secondary" id="btnDownload">
          ⬇️ Baixar JSON
        </button>
      </div>
    </section>

    <!-- LISTA DE RELATÓRIOS -->
    <section class="card soft">
      <h2>📄 Todos os Relatórios</h2>
      <div id="reportsList" style="display: grid; gap: 8px; margin-top: 12px;"></div>
    </section>
  </main>

  <script src="assets/report.js"></script>
</body>
</html>
