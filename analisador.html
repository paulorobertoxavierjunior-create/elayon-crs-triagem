<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Elayon Space • Analisador & Visualizador de Repositório CRS Triagem</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg1: #0f172a; --bg2: #1e293b; --card: rgba(30, 41, 59, 0.85);
            --ink: #f8fafc; --muted: #94a3b8; --line: rgba(255, 255, 255, 0.1);
            --accent: #0ea5e9; --accent2: #14b8a6; --accent-glow: rgba(14, 165, 233, 0.3);
            --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
            --shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh; background: linear-gradient(135deg, var(--bg1), var(--bg2));
            color: var(--ink); font-family: system-ui, -apple-system, sans-serif;
            display: flex; flex-direction: column; align-items: center; padding: 24px; padding-bottom: 100px;
        }
        .container { width: 100%; max-width: 1300px; display: grid; gap: 24px; }

        .hud-header {
            background: var(--card); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 16px;
            padding: 16px 24px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: var(--shadow);
        }
        .hud-info { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0.5px; }
        .hud-info span { color: var(--accent); }
        
        .btn-acao {
            background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; color: #000;
            padding: 10px 18px; border-radius: 10px; font-size: 12px; font-weight: 800;
            cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px var(--accent-glow);
        }
        .btn-acao:hover { transform: translateY(-2px); }

        .workspace-grid { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
        @media(max-width: 900px) { .workspace-grid { grid-template-columns: 1fr; } }

        .card {
            background: var(--card); backdrop-filter: blur(12px); border-radius: 20px; padding: 20px; border: 1px solid var(--line);
            box-shadow: var(--shadow); text-align: left;
        }
        .card h3 { font-size: 14px; color: var(--accent); margin-bottom: 12px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }

        .file-list { display: flex; flex-direction: column; gap: 6px; max-height: 500px; overflow-y: auto; }
        .file-item {
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--line); padding: 10px 12px; border-radius: 8px;
            font-size: 12px; font-family: monospace; cursor: pointer; color: var(--ink); transition: 0.2s;
            display: flex; justify-content: space-between; align-items: center;
        }
        .file-item:hover, .file-item.active { background: rgba(14, 165, 233, 0.15); border-color: var(--accent); color: var(--accent); }

        .preview-box {
            background: rgba(10, 15, 30, 0.8); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
            font-family: monospace; font-size: 12px; color: #e2e8f0; min-height: 400px; max-height: 550px; overflow-y: auto; white-space: pre-wrap;
        }

        .dropzone {
            border: 2px dashed var(--accent); border-radius: 12px; padding: 20px; text-align: center;
            background: rgba(14, 165, 233, 0.05); margin-bottom: 16px; cursor: pointer; transition: 0.3s;
        }
        .dropzone:hover { background: rgba(14, 165, 233, 0.1); }
    </style>
</head>

<body>
    <div class="container">
        
        <!-- HUD Superior -->
        <header class="hud-header">
            <div class="hud-info">ELAYON REPO VIEWER: <span id="hudStatus" style="color: var(--success);">ONLINE</span></div>
            <button class="btn-acao" onclick="refreshRepositorio()">🔄 Refresh / Sincronizar Repositório</button>
        </header>

        <!-- Painel Principal de Trabalho -->
        <div class="workspace-grid">
            
            <!-- Lista de Arquivos do Repo e PDFs -->
            <div class="card">
                <h3>📁 Arquivos do Repo & PDFs <span id="fileCount" style="font-size:10px; color:var(--muted);">[0]</span></h3>
                <div class="dropzone" onclick="document.getElementById('pdfUpload').click()">
                    📄 Clique para importar PDF Clínico ou Arraste aqui
                    <input type="file" id="pdfUpload" accept=".pdf,.html,.js" style="display:none" onchange="importarArquivoLocal(event)">
                </div>
                <div class="file-list" id="fileListContainer">
                    <!-- Preenchido via JS -->
                </div>
            </div>

            <!-- Visualizador de Código / Texto do PDF -->
            <div class="card">
                <h3>🔍 Inspeção e Contexto Clínico CRS v4 <span id="currentFileName" style="font-size:11px; color:var(--muted);">Nenhum arquivo selecionado</span></h3>
                <div class="preview-box" id="filePreviewContent">
                    Selecione um arquivo à esquerda ou importe um documento PDF para iniciar a análise detalhada para o Elayon CRS Triagem...
                </div>
                <div style="margin-top: 12px; display: flex; gap: 10px;">
                    <button class="btn-acao" style="flex:1; background:rgba(255,255,255,0.05); color:var(--ink); border:1px solid var(--line);" onclick="copiarConteudoVisualizacao()">📋 Copiar Texto</button>
                    <button class="btn-acao" style="flex:1;" onclick="enviarParaEngineCRS()">🧬 Processar na Engine CRS</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Repositório Interno Simulado / Conectado ao elayon-crs-triagem
        let repositorioArquivos = [
            { nome: 'README.md', tipo: 'markdown', conteudo: '# Elayon Health — CRS (Triagem Vocal)\n\nDemo de triagem vocal CRS - análise temporal da fala e validação clínica.' },
            { nome: 'core/crs-engine/temporal-extractor.js', tipo: 'javascript', conteudo: '// Extractor temporal de pausas, formantes e silêncio v4.' },
            { nome: 'core/crs-engine/crs-integrator.js', tipo: 'javascript', conteudo: '// Integrador central das 8 modulações fônicas.' },
            { nome: 'pages/clinical-validation.html', tipo: 'html', conteudo: '<!-- Validação clínica e relatórios de neurologia - HGV-UFAM -->\n<!DOCTYPE html>\n<html>\n<head><title>Validação</title></head>\n<body><h1>Painel Clínico</h1></body>\n</html>' },
            { nome: 'pages/crs-dashboard.html', tipo: 'html', conteudo: '<!-- Dashboard principal de Triagem Vocal CRS -->\n<!DOCTYPE html>\n<html>\n<head><title>Triagem</title></head>\n<body><h1>Dashboard de Triagem</h1></body>\n</html>' }
        ];

        function refreshRepositorio() {
            const btn = document.querySelector('.hud-header button');
            btn.innerText = "🔄 Sincronizando com GitHub...";
            setTimeout(() => {
                btn.innerText = "🔄 Refresh / Sincronizar Repositório";
                renderizarListaArquivos();
                alert('✅ Repositório elayon-crs-triagem sincronizado com sucesso! Arquivos atualizados.');
            }, 800);
        }

        function renderizarListaArquivos() {
            const container = document.getElementById('fileListContainer');
            container.innerHTML = '';
            document.getElementById('fileCount').textContent = `[${repositorioArquivos.length}]`;

            repositorioArquivos.forEach((file, index) => {
                const div = document.createElement('div');
                div.className = 'file-item';
                div.innerHTML = `<span>📄 ${file.nome}</span> <span style="font-size:9px; color:var(--muted);">${file.tipo}</span>`;
                div.onclick = () => selecionarArquivo(index);
                container.appendChild(div);
            });
        }

        function selecionarArquivo(index) {
            document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.file-item')[index].classList.add('active');

            const file = repositorioArquivos[index];
            document.getElementById('currentFileName').textContent = file.nome;
            document.getElementById('filePreviewContent').textContent = file.conteudo;
        }

        function importarArquivoLocal(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const novoArquivo = {
                    nome: `importado_${file.name}`,
                    tipo: file.name.endsWith('.pdf') ? 'pdf (texto extraído)' : 'documento',
                    conteudo: `[DOCUMENTO IMPORTADO: ${file.name}]\n\n` + e.target.result
                };
                repositorioArquivos.unshift(novoArquivo);
                renderizarListaArquivos();
                selecionarArquivo(0);
                alert(`✅ Arquivo ${file.name} integrado ao analisador interno!`);
            };
            
            if (file.name.endsWith('.pdf')) {
                // Simulação de leitura de PDF Clínico
                reader.onload({ target: { result: "CONTEÚDO EXTRAÍDO DO PDF CLÍNICO:\n- Protocolo de Triagem Vocal v4\n- Parâmetros de Jitter, Shimmer, HNR e Pausas\n- Avaliação de Risco Neurológico - HGV-UFAM" } });
            } else {
                reader.readAsText(file);
            }
        }

        function copiarConteudoVisualizacao() {
            const texto = document.getElementById('filePreviewContent').textContent;
            navigator.clipboard.writeText(texto);
            alert('📋 Conteúdo copiado para a área de transferência!');
        }

        function enviarParaEngineCRS() {
            alert('🧬 O documento selecionado foi injetado na engine de triagem CRS v4 para cruzamento de métricas.');
        }

        // Inicializa a lista ao carregar
        window.onload = renderizarListaArquivos;
    </script>
</body>
</html>
