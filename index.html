<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elayon Health — CRS</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="bg"></div>

  <header class="topbar">
    <div class="brand">
      <div class="logo">
        <img class="logoImg" src="IMG-20260218-WA0016.jpg" alt="Elayon" />
      </div>
      <div>
        <div class="brand-title">Elayon Health</div>
        <div class="brand-sub">CRS • Análise Vocal em Tempo Real</div>
      </div>
    </div>
    <nav class="nav">
      <a class="link active" href="index.html">Início</a>
      <a class="link" href="report.html">Relatórios</a>
    </nav>
  </header>

  <main class="container">
    <!-- HERO -->
    <section class="centerHero">
      <div class="heroCard">
        <div class="heroLogo">
          <img src="IMG-20260218-WA0016.jpg" alt="Logo" />
        </div>
        <h1 class="heroTitle">Elayon Health</h1>
        <p class="heroSub">
          Captura de Ritmo e Sinais Temporais Cognitivos
          <br/>
          <strong>Análise Vocal em Tempo Real</strong>
        </p>
      </div>
    </section>

    <!-- FORMULÁRIO -->
    <section class="card primary">
      <h2>🎙️ Iniciar Sessão</h2>
      <p class="muted">Preencha os dados e comece a capturar áudio.</p>

      <div class="grid2">
        <div class="field">
          <label for="medico">Médico</label>
          <input id="medico" type="text" placeholder="Dra. Ana Silva" />
        </div>
        <div class="field">
          <label for="paciente">Paciente</label>
          <input id="paciente" type="text" placeholder="João Santos" />
        </div>
      </div>

      <div class="field">
        <label for="contexto">Contexto (opcional)</label>
        <textarea id="contexto" placeholder="Ex: triagem neurológica..."></textarea>
      </div>

      <div class="actions">
        <button class="btn primary" id="btnStart">
          ▶️ Iniciar Sessão
        </button>
        <button class="btn" id="btnClear">
          🔄 Limpar
        </button>
      </div>

      <div style="margin-top: 16px;">
        <div class="badge info" id="pillReports">
          📊 Relatórios: 0/10
        </div>
      </div>
    </section>

    <!-- ÚLTIMAS SESSÕES -->
    <section class="card soft">
      <h2>📄 Últimas Sessões</h2>
      <div id="recentSessions" style="display: grid; gap: 8px; margin-top: 12px;">
        <p class="muted" style="text-align: center;">Nenhuma sessão ainda.</p>
      </div>
    </section>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
