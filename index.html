<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Elayon CRS — Início</title>
  <meta name="description" content="Elayon CRS - Demo de triagem vocal (ritmo e silêncio)." />

  <!-- (Opcional) Se existir, carrega teu CSS externo -->
  <link rel="stylesheet" href="assets/styles.css?v=1" />
  <link rel="stylesheet" href="css/style.css?v=1" />

  <!-- Fallback: funciona mesmo sem CSS externo -->
  <style>
    :root{
      --bg1:#f7fffd;   /* quase branco com verde */
      --bg2:#f3fbff;   /* quase branco com azul */
      --bg3:#f5fffb;   /* quase branco com ciano */
      --card:#ffffff;
      --text:#0f172a;
      --muted:#475569;
      --line:#e2e8f0;
      --btn:#0ea5e9;
      --btn2:#22c55e;
      --shadow: 0 12px 40px rgba(2, 6, 23, .10);
      --radius: 18px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;

      /* Degradê suave (ciano + azul claro + verde claro) */
      background:
        radial-gradient(900px 600px at 20% 20%, rgba(34,197,94,.10), transparent 60%),
        radial-gradient(900px 600px at 80% 30%, rgba(14,165,233,.10), transparent 60%),
        radial-gradient(900px 600px at 50% 90%, rgba(6,182,212,.10), transparent 60%),
        linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    }

    .wrap{
      width:min(920px, 92vw);
      padding: 26px 0;
    }

    header{
      text-align:center;
      margin-bottom: 18px;
    }

    h1{
      margin: 0 0 8px;
      font-size: 34px;
      letter-spacing: .2px;
    }

    .subtitle{
      margin:0;
      color:var(--muted);
      font-size: 14.5px;
      line-height: 1.4;
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 14px;
      justify-items:center;
    }

    .card{
      width:min(520px, 100%);
      background:var(--card);
      border:1px solid rgba(226,232,240,.85);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px 18px 14px;
    }

    .card h2{
      margin: 0 0 12px;
      font-size: 18px;
    }

    label{
      display:block;
      margin: 10px 0 6px;
      color: var(--muted);
      font-size: 13px;
    }

    input{
      width:100%;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      outline: none;
      font-size: 14.5px;
      background: #fff;
    }
    input:focus{
      border-color: rgba(14,165,233,.55);
      box-shadow: 0 0 0 4px rgba(14,165,233,.12);
    }

    .row{
      display:grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 8px;
    }

    .btn{
      width:100%;
      margin-top: 14px;
      padding: 12px 14px;
      border: none;
      border-radius: 14px;
      color: #fff;
      font-weight: 700;
      font-size: 14.5px;
      cursor: pointer;
      background: linear-gradient(90deg, var(--btn), var(--btn2));
      box-shadow: 0 10px 24px rgba(14,165,233,.18);
    }
    .btn:active{ transform: translateY(1px); }

    .note{
      margin: 12px 0 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
    }

    .foot{
      margin-top: 10px;
      font-size: 12px;
      color: rgba(71,85,105,.9);
      display:flex;
      gap:8px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      border-top: 1px dashed rgba(226,232,240,.9);
      padding-top: 10px;
    }

    .pill{
      font-size: 11.5px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(226,232,240,.9);
      background: rgba(255,255,255,.75);
      color: rgba(15,23,42,.85);
    }

    .error{
      display:none;
      margin-top:10px;
      padding:10px 12px;
      border-radius: 12px;
      border:1px solid rgba(239,68,68,.25);
      background: rgba(239,68,68,.06);
      color: #7f1d1d;
      font-size: 13px;
    }

    @media (max-width: 420px){
      h1{ font-size: 28px; }
      .card{ padding: 16px 14px 12px; }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <header>
      <h1>Elayon CRS</h1>
      <p class="subtitle">Triagem vocal inteligente • Demo funcional (ritmo e silêncio)</p>
    </header>

    <section class="grid">
      <div class="card">
        <h2>Iniciar Atendimento</h2>

        <label for="medico">Médico</label>
        <input id="medico" placeholder="Ex: Paulo" autocomplete="name" />

        <label for="paciente">Paciente</label>
        <input id="paciente" placeholder="Ex: Glaucia" autocomplete="name" />

        <button class="btn" id="btnIniciar">Iniciar Sessão</button>

        <div class="error" id="errBox"></div>

        <p class="note">
          Sugestão de captação limpa: perguntas fora da sala + resposta do paciente no microfone do celular (isolando a voz).
        </p>

        <div class="foot">
          <span class="pill">GitHub Pages: ativo</span>
          <span class="pill" id="buildInfo">v1</span>
        </div>
      </div>
    </section>
  </main>

  <!-- (Opcional) Se existir, carrega teu JS externo -->
  <script src="assets/app.js?v=1"></script>
  <script src="js/app.js?v=1"></script>

  <!-- Fallback JS: funciona mesmo sem app.js -->
  <script>
    (function(){
      const $ = (id)=>document.getElementById(id);

      const medico = $("medico");
      const paciente = $("paciente");
      const btn = $("btnIniciar");
      const err = $("errBox");

      // Pré-preenche se já existir
      try{
        const last = JSON.parse(localStorage.getItem("elayon_crs_last") || "{}");
        if(last.medico) medico.value = last.medico;
        if(last.paciente) paciente.value = last.paciente;
      }catch(e){}

      function showError(msg){
        err.style.display = "block";
        err.textContent = msg;
      }
      function clearError(){
        err.style.display = "none";
        err.textContent = "";
      }

      btn.addEventListener("click", ()=>{
        clearError();

        const m = (medico.value || "").trim();
        const p = (paciente.value || "").trim();

        if(!m || !p){
          showError("Preencha Médico e Paciente para iniciar.");
          return;
        }

        // guarda para reutilizar
        const payload = { medico: m, paciente: p, ts: Date.now() };
        localStorage.setItem("elayon_crs_last", JSON.stringify(payload));

        // Vai para a sessão (crie/ajuste session.html depois)
        const qs = new URLSearchParams({ medico: m, paciente: p }).toString();
        window.location.href = "session.html?" + qs;
      });
    })();
  </script>
</body>
</html>
