<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elayon Health — Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 50%, #0f2a1f 100%);
      color: #f1f5f9;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
      padding-top: 20px;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: rgba(14, 165, 233, 0.1);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
      font-weight: 900;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    @media (max-width: 768px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(14, 165, 233, 0.2);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(10px);
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 16px;
      color: #0ea5e9;
    }

    .card p {
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(14, 165, 233, 0.2);
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 200ms;
    }

    input:focus,
    textarea:focus {
      border-color: #0ea5e9;
      background: rgba(15, 23, 42, 0.95);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .actions {
      display: grid;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 200ms;
      text-align: center;
      display: block;
      width: 100%;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: white;
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(14, 165, 233, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #0ea5e9;
      border: 1px solid rgba(14, 165, 233, 0.3);
      font-size: 12px;
      padding: 8px 12px;
    }

    .btn-secondary:hover {
      background: rgba(14, 165, 233, 0.1);
      border-color: #0ea5e9;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
      font-size: 12px;
      padding: 8px 12px;
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: #ef4444;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      .stats {
        grid-template-columns: 1fr;
      }
    }

    .stat-box {
      background: rgba(14, 165, 233, 0.05);
      border: 1px solid rgba(14, 165, 233, 0.1);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .stat-number {
      font-size: 28px;
      font-weight: 900;
      color: #0ea5e9;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 12px;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .report-list {
      display: grid;
      gap: 12px;
    }

    .report-item {
      background: rgba(14, 165, 233, 0.05);
      border: 1px solid rgba(14, 165, 233, 0.1);
      border-radius: 12px;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
    }

    @media (max-width: 768px) {
      .report-item {
        grid-template-columns: 1fr;
      }
    }

    .report-info h3 {
      font-size: 14px;
      color: #0ea5e9;
      margin-bottom: 6px;
    }

    .report-info p {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .report-status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 8px;
    }

    .status-active {
      background: rgba(245, 158, 11, 0.1);
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.2);
    }

    .status-closed {
      background: rgba(16, 185, 129, 0.1);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .status-signed {
      background: rgba(99, 102, 241, 0.1);
      color: #6366f1;
      border: 1px solid rgba(99, 102, 241, 0.2);
    }

    .report-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #64748b;
    }

    .empty-state p {
      margin-bottom: 16px;
      font-size: 14px;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: #64748b;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- HEADER -->
    <header>
      <div class="logo">🎙️</div>
      <h1>Elayon Health</h1>
      <p class="subtitle">Dashboard de Análise Vocal CRS</p>
    </header>

    <!-- GRID: CADASTRO + ESTATÍSTICAS -->
    <div class="grid-2">
      <!-- CADASTRO DE NOVA SESSÃO -->
      <div class="card">
        <h2>🎤 Nova Sessão</h2>
        <p>Inicie uma nova análise de voz.</p>

        <div class="field">
          <label for="medico">Médico</label>
          <input id="medico" type="text" placeholder="Dra. Ana Silva" value="Dra. Ana Silva" />
        </div>

        <div class="field">
          <label for="paciente">Paciente</label>
          <input id="paciente" type="text" placeholder="João Santos" value="João Santos" />
        </div>

        <div class="field">
          <label for="contexto">Contexto (opcional)</label>
          <textarea id="contexto" placeholder="Ex: triagem neurológica..."></textarea>
        </div>

        <div class="actions">
          <button class="btn btn-primary" id="btnStart">
            ▶️ Iniciar Sessão
          </button>
          <button class="btn btn-secondary" id="btnClear">
            🔄 Limpar
          </button>
        </div>
      </div>

      <!-- ESTATÍSTICAS -->
      <div class="card">
        <h2>📊 Estatísticas</h2>
        
        <div class="stats">
          <div class="stat-box">
            <div class="stat-number" id="statTotal">0</div>
            <div class="stat-label">Total</div>
          </div>
          <div class="stat-box">
            <div class="stat-number" id="statActive">0</div>
            <div class="stat-label">Ativos</div>
          </div>
          <div class="stat-box">
            <div class="stat-number" id="statSigned">0</div>
            <div class="stat-label">Assinados</div>
          </div>
        </div>

        <p style="color: #94a3b8; font-size: 12px; text-align: center;">
          <strong>Limite:</strong> Sem limite
        </p>
      </div>
    </div>

    <!-- RELATÓRIOS -->
    <div class="card">
      <h2>📄 Relatórios</h2>
      <div class="report-list" id="reportList">
        <div class="empty-state">
          <p>Nenhum relatório ainda.</p>
          <p style="font-size: 12px;">Crie uma nova sessão para começar.</p>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>Elayon Health • CRS Dashboard • 2026</p>
  </footer>

  <script>
    // ============================================
    // CONSTANTES
    // ============================================

    const KEY_SESSIONS = "elayon_crs_sessions";

    // ============================================
    // UTILITÁRIOS
    // ============================================

    function uid() {
      return "sess_" + Date.now() + "_" + Math.random().toString(36).substr(2, 9);
    }

    function loadSessions() {
      try {
        const data = localStorage.getItem(KEY_SESSIONS);
        return data ? JSON.parse(data) : [];
      } catch (e) {
        console.error("Erro ao carregar sessões:", e);
        return [];
      }
    }

    function saveSessions(arr) {
      try {
        localStorage.setItem(KEY_SESSIONS, JSON.stringify(arr));
        updateUI();
      } catch (e) {
        console.error("Erro ao salvar:", e);
      }
    }

    function deleteSession(sessionId) {
      if (confirm("Deletar esta sessão? Todos os dados serão perdidos.")) {
        const sessions = loadSessions();
        const filtered = sessions.filter(s => s.id !== sessionId);
        saveSessions(filtered);
      }
    }

    function formatDate(ms) {
      return new Date(ms).toLocaleString("pt-BR");
    }

    function getStatusBadge(status) {
      const badges = {
        active: { class: "status-active", text: "⏱️ Ativo" },
        closed: { class: "status-closed", text: "✅ Finalizado" },
        signed: { class: "status-signed", text: "✍️ Assinado" }
      };
      const badge = badges[status] || badges.active;
      return `<span class="report-status ${badge.class}">${badge.text}</span>`;
    }

    // ============================================
    // ELEMENTOS DOM
    // ============================================

    const elMed = document.getElementById("medico");
    const elPac = document.getElementById("paciente");
    const elCtx = document.getElementById("contexto");
    const btnStart = document.getElementById("btnStart");
    const btnClear = document.getElementById("btnClear");
    const reportList = document.getElementById("reportList");
    const statTotal = document.getElementById("statTotal");
    const statActive = document.getElementById("statActive");
    const statSigned = document.getElementById("statSigned");

    // ============================================
    // ATUALIZAR UI
    // ============================================

    function updateUI() {
      const sessions = loadSessions();
      const active = sessions.filter(s => s.status === "active").length;
      const signed = sessions.filter(s => s.status === "signed").length;

      // Atualizar estatísticas
      statTotal.textContent = sessions.length;
      statActive.textContent = active;
      statSigned.textContent = signed;

      // Atualizar lista de relatórios
      if (sessions.length === 0) {
        reportList.innerHTML = `
          <div class="empty-state">
            <p>Nenhum relatório ainda.</p>
            <p style="font-size: 12px;">Crie uma nova sessão para começar.</p>
          </div>
        `;
      } else {
        reportList.innerHTML = sessions
          .map(s => `
            <div class="report-item">
              <div class="report-info">
                <h3>${s.medico} → ${s.paciente}</h3>
                <p>${formatDate(s.start)}</p>
                ${getStatusBadge(s.status)}
              </div>
              <div class="report-actions">
                ${s.status === "active" ? `<a href="session.html?id=${encodeURIComponent(s.id)}" class="btn btn-secondary">📝 Continuar</a>` : ""}
                ${s.status === "closed" ? `<a href="report.html?id=${encodeURIComponent(s.id)}" class="btn btn-secondary">📊 Relatório</a>` : ""}
                ${s.status === "signed" ? `<a href="assinatura.html?id=${encodeURIComponent(s.id)}" class="btn btn-secondary">✍️ Assinado</a>` : ""}
                <button class="btn btn-danger" onclick="deleteSession('${s.id}')">🗑️ Deletar</button>
              </div>
            </div>
          `)
          .join("");
      }
    }

    // ============================================
    // INICIALIZAÇÃO
    // ============================================

    updateUI();

    // ============================================
    // BOTÕES
    // ============================================

    if (btnStart) {
      btnStart.addEventListener("click", () => {
        const medico = (elMed.value || "").trim();
        const paciente = (elPac.value || "").trim();
        const contexto = (elCtx.value || "").trim();

        if (!medico || !paciente) {
          alert("Preencha Médico e Paciente");
          return;
        }

        const session = {
          id: uid(),
          medico,
          paciente,
          contexto,
          start: Date.now(),
          status: "active",
          recordedSec: 0,
          audioBuffer: [],
          snaps: null,
          dx: ""
        };

        const sessions = loadSessions();
        sessions.unshift(session);
        saveSessions(sessions);

        setTimeout(() => {
          location.href = `session.html?id=${encodeURIComponent(session.id)}`;
        }, 300);
      });
    }

    if (btnClear) {
      btnClear.addEventListener("click", () => {
        elMed.value = "";
        elPac.value = "";
        elCtx.value = "";
      });
    }

    // ============================================
    // ATUALIZAR A CADA 3 SEGUNDOS
    // ============================================

    setInterval(updateUI, 3000);
  </script>
</body>
</html>
