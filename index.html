<style>
  :root{
    --bg1:#f6fbff;   /* quase branco azulado */
    --bg2:#f0fffd;   /* quase branco ciano */
    --bg3:#f3fff7;   /* quase branco esverdeado */
    --card:#ffffffcc; /* branco com leve transparência */
    --stroke:#dbeafe; /* borda azul bem clara */
    --text:#0f172a;   /* texto escuro elegante */
    --muted:#334155;  /* texto secundário */
    --btn1:#22c55e;   /* verde */
    --btn2:#06b6d4;   /* ciano */
    --shadow: 0 10px 30px rgba(2, 132, 199, 0.12);
  }

  *{ box-sizing:border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }

  <body>

<!-- cola aqui -->
<div class="wrap">
  <h1>Elayon CRS</h1>
  <p class="subtitle">Triagem vocal inteligente</p>

  <div class="card">
    <h2>Iniciar Atendimento</h2>

    <label for="medico">Médico:</label>
    <input id="medico" placeholder="Ex: Paulo" />

    <label for="paciente">Paciente:</label>
    <input id="paciente" placeholder="Ex: Glaucia" />

    <button class="btn" id="btnIniciar">Iniciar Sessão</button>

    <div class="foot">Publicação ativa via GitHub Pages.</div>
  </div>
</div>

</body>
  .wrap{
    width:min(520px, 100%);
    text-align:center;
  }

  h1{
    margin:0 0 6px 0;
    font-size:34px;
    letter-spacing:-0.5px;
  }

  .subtitle{
    margin:0 0 18px 0;
    color:var(--muted);
    font-size:14px;
  }

  .card{
    margin:0 auto;
    width:min(420px, 100%);
    background:var(--card);
    border:1px solid var(--stroke);
    border-radius:18px;
    box-shadow: var(--shadow);
    padding:18px 18px 16px;
    backdrop-filter: blur(6px);
  }

  .card h2{
    margin:6px 0 14px 0;
    font-size:18px;
  }

  label{
    display:block;
    text-align:left;
    font-size:12px;
    color:var(--muted);
    margin:10px 0 6px;
  }

  input{
    width:100%;
    padding:12px 12px;
    border-radius:12px;
    border:1px solid var(--stroke);
    outline:none;
    background:#ffffff;
    font-size:14px;
  }

  input:focus{
    border-color:#93c5fd;
    box-shadow: 0 0 0 4px rgba(59,130,246,0.12);
  }

  .btn{
    width:100%;
    margin-top:14px;
    padding:12px 14px;
    border:none;
    border-radius:14px;
    color:#fff;
    font-weight:700;
    cursor:pointer;
    background: linear-gradient(90deg, var(--btn2), var(--btn1));
    box-shadow: 0 10px 18px rgba(34,197,94,0.12);
  }

  .btn:active{ transform: translateY(1px); }

  .foot{
    margin-top:10px;
    font-size:12px;
    color:var(--muted);
    opacity:0.85;
  }
</style>
