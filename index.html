<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elayon Health • Seleção de Perfil</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-dark: #0a192f;
      --card-dark: #112240;
      --border-line: #233554;
      --text-main: #e6f1ff;
      --text-muted: #8892b0;
      --accent-teal: #2a9d8f;
      --accent-bright: #3ecfcf;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0; padding: 0;
      min-height: 100vh;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
    }

    .minimal-card {
      background: var(--card-dark);
      border: 1px solid var(--border-line);
      border-radius: 20px;
      padding: 32px;
      width: 100%; max-width: 480px;
      text-align: center;
      box-sizing: border-box;
      margin: 16px;
    }

    .role-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 24px 0;
    }

    .role-card {
      background: #0d1b2a;
      border: 2px solid var(--border-line);
      border-radius: 14px;
      padding: 20px 12px;
      cursor: pointer;
      transition: 0.2s;
      color: var(--text-main);
    }

    .role-card:hover, .role-card.active {
      border-color: var(--accent-bright);
      background: #132a4a;
    }

    .role-icon { font-size: 28px; display: block; margin-bottom: 8px; }
    .role-title { font-size: 14px; font-weight: 800; color: #fff; }
    .role-desc { font-size: 10px; color: var(--text-muted); margin-top: 4px; }

    .input-box {
      text-align: left;
      margin-bottom: 16px;
    }

    .input-box label {
      display: block;
      font-size: 10px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .input-field {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-line);
      background: #081222;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      box-sizing: border-box;
    }

    .input-field:focus { border-color: var(--accent-bright); }

    .btn-enter {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-teal), var(--accent-bright));
      color: #041f24;
      font-weight: 800;
      font-size: 14px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-enter:hover { opacity: 0.95; transform: scale(0.99); }
  </style>
</head>
<body>

  <main class="minimal-card">
    <div style="font-size:24px; margin-bottom:4px;">🧬</div>
    <h1 style="font-size:18px; margin:0 0 6px 0; color:#fff;">Elayon Health</h1>
    <p style="font-size:11px; color:var(--text-muted); margin:0 0 20px 0;">
      Selecione seu papel para iniciar a experiência simbiótica
    </p>

    <!-- Escolha de Papel Minimalista -->
    <div class="role-grid">
      <div class="role-card active" id="cardUser" onclick="escolherPapel('usuario')">
        <span class="role-icon">🗣️</span>
        <div class="role-title">Usuário</div>
        <div class="role-desc">Paciente / Auto-consulta</div>
      </div>

      <div class="role-card" id="cardPilot" onclick="escolherPapel('piloto')">
        <span class="role-icon">👨‍⚕️</span>
        <div class="role-title">Piloto</div>
        <div class="role-desc">Médico / Atendimento</div>
      </div>
    </div>

    <!-- Seção Dinâmica do Usuário -->
    <div id="sectionUser">
      <div class="input-box">
        <label for="userIdInput">Seu ID de Usuário (Supabase):</label>
        <input type="text" id="userIdInput" class="input-field" value="c708823f-a48a-41f0-948f-287eee484821" />
      </div>
    </div>

    <!-- Seção Dinâmica do Piloto -->
    <div id="sectionPilot" style="display:none;">
      <div class="input-box">
        <label for="pilotTargetIdInput">ID do Paciente a Acompanhar:</label>
        <input type="text" id="pilotTargetIdInput" class="input-field" value="c708823f-a48a-41f0-948f-287eee484821" />
      </div>
    </div>

    <button class="btn-enter" id="btnAvancar" onclick="entrarNoPainel()">
      🚀 Entrar como Usuário
    </button>
  </main>

  <script>
    let papelSelecionado = 'usuario';

    function escolherPapel(papel) {
      papelSelecionado = papel;
      document.getElementById('cardUser').classList.toggle('active', papel === 'usuario');
      document.getElementById('cardPilot').classList.toggle('active', papel === 'piloto');

      document.getElementById('sectionUser').style.display = (papel === 'usuario') ? 'block' : 'none';
      document.getElementById('sectionPilot').style.display = (papel === 'piloto') ? 'block' : 'none';

      const btn = document.getElementById('btnAvancar');
      btn.textContent = (papel === 'usuario') ? '🚀 Entrar no Painel do Usuário' : '📞 Acessar Painel do Piloto (WhatsApp)';
    }

    function entrarNoPainel() {
      if (papelSelecionado === 'usuario') {
        const uid = document.getElementById('userIdInput').value.trim();
        window.location.href = `dashboard-user.html?user_id=${encodeURIComponent(uid)}`;
      } else {
        const targetId = document.getElementById('pilotTargetIdInput').value.trim();
        window.location.href = `dashboard-pilot.html?target_id=${encodeURIComponent(targetId)}`;
      }
    }
  </script>
</body>
</html>
