<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elayon Health • Triagem & Conexão Clínica CRS</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg1: #f4f9f4; --bg2: #eaf4f6; --card: #ffffff;
      --ink: #0a2a2f; --muted: #4a6b70; --line: #d8e8eb;
      --accent: #2a9d8f; --accent2: #3ecfcf; --success: #2b8a3e;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; background: radial-gradient(circle at top left, var(--bg1), var(--bg2));
      color: var(--ink); font-family: system-ui, -apple-system, sans-serif;
      display: flex; justify-content: center; align-items: center; padding: 20px;
    }
    .selection-card {
      background: var(--card); border: 1px solid var(--line); border-radius: 24px;
      padding: 32px; width: 100%; max-width: 520px; text-align: center;
      box-shadow: var(--shadow);
    }
    .brand-title { font-size: 22px; font-weight: 800; color: var(--ink); margin-bottom: 6px; }
    .brand-sub { font-size: 12px; color: var(--muted); margin-bottom: 24px; }
    
    .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
    .btn-role {
      background: #f8fbfa; border: 2px solid var(--line); border-radius: 16px;
      padding: 20px 14px; cursor: pointer; transition: 0.2s; text-align: center;
    }
    .btn-role:hover, .btn-role.active {
      border-color: var(--accent); background: #eef7f6; transform: translateY(-2px);
    }
    .role-icon { font-size: 28px; margin-bottom: 8px; display: block; }
    .role-name { font-size: 13px; font-weight: 800; color: var(--ink); }
    .role-desc { font-size: 10px; color: var(--muted); margin-top: 4px; }

    .patient-id-box {
      background: #f8fbfa; border: 1px solid var(--line); border-radius: 14px;
      padding: 16px; margin-bottom: 20px; text-align: left; display: none;
    }
    .input-label { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; display: block; }
    .input-field {
      width: 100%; padding: 12px; border-radius: 10px; border: 1.5px solid var(--line);
      font-family: monospace; font-size: 12px; outline: none; transition: 0.2s;
    }
    .input-field:focus { border-color: var(--accent); background: #fff; }

    .btn-connect {
      width: 100%; background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; border: none; padding: 16px; border-radius: 14px;
      font-size: 14px; font-weight: 800; cursor: pointer; transition: 0.2s;
      box-shadow: 0 4px 15px rgba(42, 157, 143, 0.2);
    }
    .btn-connect:hover { opacity: 0.95; transform: scale(0.99); }
  </style>
</head>
<body>

  <main class="selection-card">
    <h1 class="brand-title">🧬 Elayon Health</h1>
    <p class="brand-sub">Ecossistema Simbiótico • Triagem & Conexão CRS em Tempo Real</p>

    <!-- Seleção dos 2 Perfis -->
    <div class="role-grid">
      <div class="btn-role" id="btnPerfilUsuario" onclick="selecionarPerfil('paciente')">
        <span class="role-icon">🗣️</span>
        <div class="role-name">Usuário / Paciente</div>
        <div class="role-desc">Fonação & Escuta Simbiótica</div>
      </div>

      <div class="btn-role" id="btnPerfilPiloto" onclick="selecionarPerfil('medico')">
        <span class="role-icon">👨‍⚕️</span>
        <div class="role-name">Piloto / Médico</div>
        <div class="role-desc">Monitoramento & API 1 Hz</div>
      </div>
    </div>

    <!-- Campo do ID do Paciente (Para o Perfil Médico) -->
    <div class="patient-id-box" id="boxIdPaciente">
      <label class="input-label">ID do Paciente (Supabase / Elayon Space):</label>
      <input type="text" class="input-field" id="txtIdPaciente" placeholder="Ex: c708823f-a48a-41f0-948f-287eee484821" value="c708823f-a48a-41f0-948f-287eee484821" />
      <span style="font-size: 9px; color: var(--muted); margin-top: 6px; display: block;">
        🔗 Conecta diretamente à API de streaming do paciente a 1 Hz.
      </span>
    </div>

    <button class="btn-connect" id="btnEntrarDashboard" onclick="conectarEAbrirDashboard()">
      🚀 Conectar ao Elayon Health
    </button>
  </main>

  <script>
    let perfilSelecionado = 'paciente';

    function selecionarPerfil(perfil) {
      perfilSelecionado = perfil;
      document.getElementById('btnPerfilUsuario').classList.toggle('active', perfil === 'paciente');
      document.getElementById('btnPerfilPiloto').classList.toggle('active', perfil === 'medico');

      const boxId = document.getElementById('boxIdPaciente');
      boxId.style.display = (perfil === 'medico') ? 'block' : 'none';
    }

    function conectarEAbrirDashboard() {
      if (perfilSelecionado === 'medico') {
        const idPaciente = document.getElementById('txtIdPaciente').value.trim();
        if (!idPaciente) {
          alert('Por favor, insira o ID do paciente cadastrado no Supabase.');
          return;
        }
        // Redireciona para o dashboard do médico passando o ID do paciente na URL
        window.location.href = `pages/crs-dashboard.html?role=medico&patient_id=${encodeURIComponent(idPaciente)}`;
      } else {
        // Redireciona para o dashboard do paciente
        window.location.href = `pages/crs-dashboard.html?role=paciente`;
      }
    }

    // Inicializa com o perfil de paciente ativo
    selecionarPerfil('paciente');
  </script>

</body>
</html>
