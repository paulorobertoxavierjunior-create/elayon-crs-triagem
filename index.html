<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elayon CRS — Entrar</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="bg"></div>

  <header class="topbar">
    <div class="brand">
      <div class="logo">E</div>
      <div>
        <div class="brand-title">Elayon CRS</div>
        <div class="brand-sub">Humanidade e Tecnologia em Harmonia • Demo</div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <div class="row" style="justify-content:space-between; gap:14px; align-items:center">
        <div>
          <h1>Entrar</h1>
          <p class="muted">Acesso do médico (demo). Sem diagnóstico automático — o humano assina o laudo.</p>
        </div>

        <!-- logo -->
        <div style="display:flex; align-items:center; gap:10px">
          <img src="assets/img/logo.png" alt="Elayon" class="logoImg" />
        </div>
      </div>

      <div class="grid2">
        <div class="field">
          <label for="nome">Nome</label>
          <input id="nome" placeholder="Ex: Dr. Paulo" autocomplete="name" />
        </div>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" placeholder="ex@hospital.com" autocomplete="email" />
        </div>
      </div>

      <div class="grid2">
        <div class="field">
          <label for="crm">CRM (opcional nesta fase)</label>
          <input id="crm" placeholder="Ex: CRM-AM 00000" />
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <input id="senha" type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
      </div>

      <div class="actions">
        <button class="btn primary" id="btnEntrar">Entrar</button>
        <button class="btn" id="btnDemo">Preencher demo</button>
      </div>

      <div class="mini">
        <div class="pill info">Dados ficam no dispositivo (localStorage)</div>
        <div class="pill warn">Use apenas com consentimento do paciente</div>
        <div class="pill ok">Ética: médico responsável pelo diagnóstico</div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span>Elayon CRS • Login • Demo</span>
  </footer>

  <script type="module" src="assets/auth.js"></script>
</body>
</html>
